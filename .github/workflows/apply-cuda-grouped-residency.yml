name: Apply CUDA grouped residency patch

on:
  push:
    branches:
      - perf/cuda-grouped-residency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cuda-grouped-residency
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exactness-preserving grouped residency changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          kernel_path = Path("crates/leo-core/src/cuda_kernels.cu")
          text = kernel_path.read_text(encoding="utf-8")

          body_start_marker = "template <bool PROFILED>\n__device__ __forceinline__ void leo_shared_wavefront_persistent_grouped_body("
          wrapper_marker = '\nextern "C" __global__ void leo_shared_wavefront_persistent_grouped('
          start = text.index(body_start_marker)
          end = text.index(wrapper_marker, start)
          body = text[start:end]

          grid_decl = "    cooperative_groups::grid_group grid = cooperative_groups::this_grid();\n"
          if body.count(grid_decl) != 1:
              raise SystemExit("expected one long-lived grouped grid_group declaration")
          body = body.replace(grid_decl, "", 1)

          old_pointer_block = '''        unsigned int* rec_current_list = nullptr;
          unsigned int* rec_current_count = nullptr;
          unsigned int* rec_next_list = nullptr;
          unsigned int* rec_next_count = nullptr;
          unsigned int* input_current_list = nullptr;
          unsigned int* input_current_count = nullptr;
          unsigned int* input_next_list = nullptr;
          unsigned int* input_next_count = nullptr;
          if (active) {
              unsigned int* rec_a_list = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_LIST);
              unsigned int* rec_a_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_COUNT);
              unsigned int* rec_b_list = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_LIST);
              unsigned int* rec_b_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_COUNT);
              unsigned int* input_a_list = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_LIST);
              unsigned int* input_a_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_COUNT);
              unsigned int* input_b_list = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_LIST);
              unsigned int* input_b_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_COUNT);
              const bool even = (step_index & 1U) == 0U;
              rec_current_list = even ? rec_a_list : rec_b_list;
              rec_current_count = even ? rec_a_count : rec_b_count;
              rec_next_list = even ? rec_b_list : rec_a_list;
              rec_next_count = even ? rec_b_count : rec_a_count;
              input_current_list = even ? input_a_list : input_b_list;
              input_current_count = even ? input_a_count : input_b_count;
              input_next_list = even ? input_b_list : input_a_list;
              input_next_count = even ? input_b_count : input_a_count;
          }

          if (learning_trace && lane_leader && threadIdx.x == 0U) {
              *rec_next_count = 0U;
              *input_next_count = 0U;
          }
          grid.sync();

          if (learning_trace) {
              leo_p_update_recurrent_eligibility_work_fast(
                  p, tick, rec_current_list, rec_current_count, rec_next_list,
                  rec_next_count, lane_thread, lane_stride
              );
          }
          grid.sync();

          if (learning_trace) {
              leo_p_update_input_eligibility_work_fast(
                  p, tick, input_current_list, input_current_count, input_next_list,
                  input_next_count, lane_thread, lane_stride
              );
          }
          grid.sync();
'''

          new_pointer_block = '''        // Rebuild ping-pong eligibility pointers only in the phases that consume
          // them. Keeping eight 64-bit pointers live across the whole persistent
          // step inflated register pressure enough to halve Pascal residency.
          if (learning_trace && lane_leader && threadIdx.x == 0U) {
              const bool even = (step_index & 1U) == 0U;
              unsigned int* rec_a_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_COUNT);
              unsigned int* rec_b_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_COUNT);
              unsigned int* input_a_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_COUNT);
              unsigned int* input_b_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_COUNT);
              *(even ? rec_b_count : rec_a_count) = 0U;
              *(even ? input_b_count : input_a_count) = 0U;
          }
          grid.sync();

          if (learning_trace) {
              const bool even = (step_index & 1U) == 0U;
              unsigned int* rec_a_list = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_LIST);
              unsigned int* rec_a_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_COUNT);
              unsigned int* rec_b_list = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_LIST);
              unsigned int* rec_b_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_COUNT);
              leo_p_update_recurrent_eligibility_work_fast(
                  p, tick,
                  even ? rec_a_list : rec_b_list,
                  even ? rec_a_count : rec_b_count,
                  even ? rec_b_list : rec_a_list,
                  even ? rec_b_count : rec_a_count,
                  lane_thread, lane_stride
              );
          }
          grid.sync();

          if (learning_trace) {
              const bool even = (step_index & 1U) == 0U;
              unsigned int* input_a_list = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_LIST);
              unsigned int* input_a_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_COUNT);
              unsigned int* input_b_list = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_LIST);
              unsigned int* input_b_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_COUNT);
              leo_p_update_input_eligibility_work_fast(
                  p, tick,
                  even ? input_a_list : input_b_list,
                  even ? input_a_count : input_b_count,
                  even ? input_b_list : input_a_list,
                  even ? input_b_count : input_a_count,
                  lane_thread, lane_stride
              );
          }
          grid.sync();
'''
          if body.count(old_pointer_block) != 1:
              raise SystemExit("grouped eligibility pointer block did not match expected source")
          body = body.replace(old_pointer_block, new_pointer_block, 1)

          old_rec_update = '''        if (supervised) {
              const unsigned int* learning_rec_list = learning_trace
                  ? rec_next_list : rec_current_list;
              const unsigned int* learning_rec_count = learning_trace
                  ? rec_next_count : rec_current_count;
              leo_p_update_recurrent_weights_work_fast(
                  p, learning_rec_list, learning_rec_count, step.supervised_strength,
                  lane_thread, lane_stride
              );
          }
'''
          new_rec_update = '''        if (supervised) {
              const bool even = (step_index & 1U) == 0U;
              const unsigned int* rec_a_list = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_LIST);
              const unsigned int* rec_a_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_ELIGIBLE_COUNT);
              const unsigned int* rec_b_list = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_LIST);
              const unsigned int* rec_b_count = leo_p_ptr<unsigned int>(p, LEO_P_REC_NEXT_ELIGIBLE_COUNT);
              const unsigned int* learning_rec_list = learning_trace
                  ? (even ? rec_b_list : rec_a_list)
                  : (even ? rec_a_list : rec_b_list);
              const unsigned int* learning_rec_count = learning_trace
                  ? (even ? rec_b_count : rec_a_count)
                  : (even ? rec_a_count : rec_b_count);
              leo_p_update_recurrent_weights_work_fast(
                  p, learning_rec_list, learning_rec_count, step.supervised_strength,
                  lane_thread, lane_stride
              );
          }
'''
          if body.count(old_rec_update) != 1:
              raise SystemExit("grouped recurrent update block did not match expected source")
          body = body.replace(old_rec_update, new_rec_update, 1)

          old_input_update = '''        if (supervised) {
              const unsigned int* learning_input_list = learning_trace
                  ? input_next_list : input_current_list;
              const unsigned int* learning_input_count = learning_trace
                  ? input_next_count : input_current_count;
              leo_p_update_input_weights_work_fast(
                  p, learning_input_list, learning_input_count, step.supervised_strength,
                  lane_thread, lane_stride
              );
          }
'''
          new_input_update = '''        if (supervised) {
              const bool even = (step_index & 1U) == 0U;
              const unsigned int* input_a_list = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_LIST);
              const unsigned int* input_a_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_ELIGIBLE_COUNT);
              const unsigned int* input_b_list = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_LIST);
              const unsigned int* input_b_count = leo_p_ptr<unsigned int>(p, LEO_P_INPUT_NEXT_ELIGIBLE_COUNT);
              const unsigned int* learning_input_list = learning_trace
                  ? (even ? input_b_list : input_a_list)
                  : (even ? input_a_list : input_b_list);
              const unsigned int* learning_input_count = learning_trace
                  ? (even ? input_b_count : input_a_count)
                  : (even ? input_a_count : input_b_count);
              leo_p_update_input_weights_work_fast(
                  p, learning_input_list, learning_input_count, step.supervised_strength,
                  lane_thread, lane_stride
              );
          }
'''
          if body.count(old_input_update) != 1:
              raise SystemExit("grouped input update block did not match expected source")
          body = body.replace(old_input_update, new_input_update, 1)

          sync_count = body.count("grid.sync();")
          if sync_count < 19:
              raise SystemExit(f"expected >=19 grouped grid barriers, found {sync_count}")
          body = body.replace("grid.sync();", "cooperative_groups::this_grid().sync();")
          text = text[:start] + body + text[end:]

          prod = 'extern "C" __global__ void leo_shared_wavefront_persistent_grouped(\n'
          prod_repl = 'extern "C" __global__ void\n__launch_bounds__(256, 2)\nleo_shared_wavefront_persistent_grouped(\n'
          if text.count(prod) != 1:
              raise SystemExit("production grouped kernel declaration did not match expected source")
          text = text.replace(prod, prod_repl, 1)

          prof = 'extern "C" __global__ void leo_shared_wavefront_persistent_grouped_profiled(\n'
          prof_repl = 'extern "C" __global__ void\n__launch_bounds__(256, 2)\nleo_shared_wavefront_persistent_grouped_profiled(\n'
          if text.count(prof) != 1:
              raise SystemExit("profiled grouped kernel declaration did not match expected source")
          text = text.replace(prof, prof_repl, 1)

          kernel_path.write_text(text, encoding="utf-8")

          test_path = Path("python/tests/test_cuda_execution_optimizations.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '        self.assertGreaterEqual(grouped.count("grid.sync();"), 19)\n'
          new = (
              '        self.assertGreaterEqual(\n'
              '            grouped.count("cooperative_groups::this_grid().sync();"), 19\n'
              '        )\n'
              '        self.assertNotIn("cooperative_groups::grid_group grid", grouped)\n'
              '        self.assertNotIn("rec_current_list = nullptr", grouped)\n'
              '        self.assertIn(\n'
              '            "__launch_bounds__(256, 2)\\nleo_shared_wavefront_persistent_grouped(",\n'
              '            kernels,\n'
              '        )\n'
              '        self.assertIn(\n'
              '            "__launch_bounds__(256, 2)\\nleo_shared_wavefront_persistent_grouped_profiled(",\n'
              '            kernels,\n'
              '        )\n'
          )
          if tests.count(old) != 1:
              raise SystemExit("grouped barrier source assertion did not match expected test")
          tests = tests.replace(old, new, 1)
          old_gate = '        self.assertIn("blocks_per_lane_max", gpu_gate)\n'
          new_gate = old_gate + '        self.assertIn("Grouped residency gate OK", gpu_gate)\n'
          if tests.count(old_gate) != 1:
              raise SystemExit("grouped GPU gate assertion did not match expected test")
          tests = tests.replace(old_gate, new_gate, 1)
          test_path.write_text(tests, encoding="utf-8")

          gate_path = Path("scripts/check_gpu.sh")
          gate = gate_path.read_text(encoding="utf-8")
          needle = '''if not launches:
              raise SystemExit("full-capacity grouped gate did not observe grouped production launch")
          max_blocks_per_lane = max(int(row.get("blocks_per_lane_max", 0)) for row in launches)
'''
          replacement = '''if not launches:
              raise SystemExit("full-capacity grouped gate did not observe grouped production launch")

          resources = [
              row
              for row in a_events
              if row.get("event") == "cuda_kernel_resources"
              and row.get("kernel") == "leo_shared_wavefront_persistent_grouped"
          ]
          runtimes = [row for row in a_events if row.get("event") == "cuda_debug_runtime"]
          if not resources or not runtimes:
              raise SystemExit("full-capacity grouped gate is missing runtime/resource telemetry")
          resource = resources[-1]
          runtime = runtimes[-1]
          blocks_per_sm = float(resource.get("blocks_per_sm", 0.0))
          occupancy = float(resource.get("theoretical_thread_occupancy", 0.0))
          capacity = int(resource.get("cooperative_capacity_blocks", 0))
          sm_count = int(runtime.get("sm_count", 0))
          if blocks_per_sm < 2.0:
              raise SystemExit(f"grouped kernel residency below two CTAs/SM: {resource}")
          if occupancy < 0.25:
              raise SystemExit(f"grouped kernel theoretical occupancy below 25%: {resource}")
          if sm_count <= 0 or capacity < 2 * sm_count:
              raise SystemExit(
                  "grouped cooperative capacity does not cover two CTAs per SM: "
                  f"capacity={capacity} sm_count={sm_count}"
              )
          print(
              "Grouped residency gate OK:",
              f"registers_per_thread={resource.get('registers_per_thread')}",
              f"blocks_per_sm={blocks_per_sm}",
              f"occupancy={occupancy}",
              f"cooperative_capacity_blocks={capacity}",
          )

          max_blocks_per_lane = max(int(row.get("blocks_per_lane_max", 0)) for row in launches)
'''
          if gate.count(needle) != 1:
              raise SystemExit("grouped gate launch parser did not match expected source")
          gate = gate.replace(needle, replacement, 1)
          gate_path.write_text(gate, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## Unreleased\n\n"
          entry = (
              "- Restore grouped CUDA residency after the cooperative-grid exactness fix by shortening "
              "persistent eligibility-pointer lifetimes, avoiding a loop-wide cooperative grid object, "
              "and applying a two-CTA-per-SM launch bound; extend the GPU gate to require at least 25% "
              "theoretical occupancy while preserving exact training-state hashes.\n"
          )
          if marker not in changelog:
              raise SystemExit("Unreleased changelog marker missing")
          if entry not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Run static regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s python/tests -p 'test_cuda_execution_optimizations.py' -v
          git diff --check

      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cuda-grouped-residency.yml
          git add CHANGELOG.md crates/leo-core/src/cuda_kernels.cu python/tests/test_cuda_execution_optimizations.py scripts/check_gpu.sh
          git diff --cached --check
          git commit -m "perf(cuda): restore grouped kernel residency"
          git push origin HEAD:perf/cuda-grouped-residency
