name: gpu-ci

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/**'
      - 'configs/**'
      - 'scripts/check.sh'
      - 'scripts/check_gpu.sh'
      - '.github/workflows/gpu-ci.yml'
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: leo-gpu-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cuda:
    # Configure repository/org variable LEO_GPU_RUNNER to the exact GitHub
    # larger-runner name or a custom label attached to a self-hosted GPU runner.
    # With no GPU runner configured the scheduled workflow is safely skipped.
    if: ${{ vars.LEO_GPU_RUNNER != '' }}
    runs-on: ${{ vars.LEO_GPU_RUNNER }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned toolchain action
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: CUDA device and toolkit
        run: |
          nvidia-smi
          test -f "${CUDA_HOME:-/usr/local/cuda}/include/cooperative_groups.h" || \
            test -f "${CUDA_PATH:-/usr/local/cuda}/include/cooperative_groups.h"
      - name: CPU/static + CUDA/NVRTC/conformance smoke
        env:
          CI: '1'
          LEO_CACHE_DIR: ${{ runner.temp }}/leo-cache
        run: bash ./scripts/check_gpu.sh
