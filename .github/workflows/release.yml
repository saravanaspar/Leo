name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release version (for example 1.0.2 or v1.0.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Require release token
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing repository secret RELEASE_TOKEN." >&2
            echo "Create a fine-grained PAT for this repository with Contents: Read/Write, Pull requests: Read/Write, and Actions: Read, then save it as RELEASE_TOKEN." >&2
            exit 1
          fi

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run releases from the main branch; got $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned toolchain action
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Normalize requested version
        shell: bash
        run: |
          VERSION=$(python3 scripts/release.py normalize "${{ inputs.version }}")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/v$VERSION" >> "$GITHUB_ENV"

      - name: Inspect current release state
        id: state
        shell: bash
        run: |
          CURRENT=$(python3 scripts/release.py current)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists; nothing to do."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_released=false" >> "$GITHUB_OUTPUT"
          if [[ "$CURRENT" == "$VERSION" ]]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release metadata
        if: steps.state.outputs.already_released != 'true' && steps.state.outputs.prepared != 'true'
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Remote release branch $BRANCH already exists. Resolve or delete it before rerunning." >&2
            exit 1
          fi

          python3 scripts/release.py prepare --version "$VERSION"

          # Updating the workspace package version causes Cargo to refresh the
          # workspace package entries in Cargo.lock.
          cargo check --workspace
          cargo fmt --all -- --check
          cargo build --workspace
          bash ./scripts/check.sh
          python3 scripts/release.py verify --version "$VERSION"

      - name: Create protected release PR
        id: pr
        if: steps.state.outputs.already_released != 'true' && steps.state.outputs.prepared != 'true'
        shell: bash
        run: |
          RELEASE_LOGIN=$(gh api user --jq .login)
          RELEASE_USER_ID=$(gh api user --jq .id)
          git config user.name "$RELEASE_LOGIN"
          git config user.email "${RELEASE_USER_ID}+${RELEASE_LOGIN}@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock CITATION.cff CHANGELOG.md docs/SEMANTICS.md
          git commit -m "chore(release): v$VERSION"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "Automated release metadata for Leo v$VERSION. This updates software release metadata and CHANGELOG only; semantic/schema contract versions are unchanged.")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for required PR checks
        if: steps.state.outputs.already_released != 'true' && steps.state.outputs.prepared != 'true'
        shell: bash
        run: |
          # The PR is created with RELEASE_TOKEN rather than GITHUB_TOKEN so
          # the repository's normal pull_request CI is triggered. Wait until at
          # least one required check is registered, then watch it to completion.
          for attempt in $(seq 1 30); do
            set +e
            CHECK_OUTPUT=$(gh pr checks "${{ steps.pr.outputs.url }}" --required 2>&1)
            set -e
            if ! grep -qi "no checks reported" <<<"$CHECK_OUTPUT"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Required PR checks never appeared." >&2
              echo "$CHECK_OUTPUT" >&2
              exit 1
            fi
            sleep 2
          done
          gh pr checks "${{ steps.pr.outputs.url }}" --required --watch --interval 10

      - name: Squash-merge release PR
        if: steps.state.outputs.already_released != 'true' && steps.state.outputs.prepared != 'true'
        shell: bash
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      - name: Refresh merged main and verify metadata
        if: steps.state.outputs.already_released != 'true'
        shell: bash
        run: |
          git fetch origin main --tags
          RELEASE_SHA=$(git log origin/main -S "version = \"$VERSION\"" --format=%H -n 1 -- Cargo.toml)
          if [[ -z "$RELEASE_SHA" ]]; then
            echo "Could not locate the main-branch commit that introduced version $VERSION." >&2
            exit 1
          fi
          git switch --detach "$RELEASE_SHA"
          python3 scripts/release.py verify --version "$VERSION"

      - name: Create immutable release tag
        if: steps.state.outputs.already_released != 'true'
        shell: bash
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_SHA" != "$TARGET_SHA" ]]; then
              echo "$TAG already exists but points to $TAG_SHA instead of $TARGET_SHA" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" "$TARGET_SHA" -m "Leo $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.state.outputs.already_released != 'true'
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            exit 0
          fi
          python3 scripts/release.py notes --version "$VERSION" > /tmp/leo-release-notes.md
          gh release create "$TAG" \
            --verify-tag \
            --title "Leo $TAG" \
            --notes-file /tmp/leo-release-notes.md
